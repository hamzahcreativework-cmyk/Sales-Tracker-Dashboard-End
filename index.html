<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calender Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-background: #F7F8FA;
            --color-background-start: #F7F8FA;
            --color-background-end: #F0F1F3;
            --color-surface: #ffffff;
            --color-primary: #4F46E5;
            --color-primary-dark: #4338CA;
            --color-primary-surface: rgba(79, 70, 229, 0.08);
            --color-text-primary: #111827;
            --color-text-secondary: #6B7280;
            --color-border: #E5E7EB;
            --color-interactive: #F3F4F6;
            --color-interactive-hover: #E5E7EB;
            --color-danger: #EF4444;
            --color-success: #10B981;
            --color-warning: #F59E0B;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
            --shadow-md: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.06);
            --shadow-lg: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-inner: inset 0 2px 4px 0 rgb(0 0 0 / 0.04);
        }

        [data-theme="dark"] {
            --color-background: #0F172A;
            --color-background-start: #0F172A;
            --color-background-end: #1E293B;
            --color-surface: #1E293B;
            --color-primary: #6366F1;
            --color-primary-dark: #818CF8;
            --color-primary-hover: #818CF8;
            --color-primary-surface: rgba(99, 102, 241, 0.15);
            --color-text-primary: #F1F5F9;
            --color-text-secondary: #94A3B8;
            --color-border: #334155;
            --color-interactive: #334155;
            --color-interactive-hover: #475569;
            --color-danger: #F87171;
            --color-success: #34D399;
            --color-warning: #FBBF24;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 1px 3px 0 rgb(0 0 0 / 0.4), 0 1px 2px -1px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
            --shadow-inner: inset 0 2px 4px 0 rgb(0 0 0 / 0.3);
            color-scheme: dark;
        }

        html {
            color-scheme: light dark;
            font-size: 14px;
        }

        @media (min-width: 640px) {
            html { font-size: 14.5px; }
        }
        @media (min-width: 1024px) {
            html { font-size: 15px; }
        }

        body {
            background-color: var(--color-background);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--color-text-secondary);
            -webkit-text-size-adjust: 100%;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-interactive-hover); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-text-secondary); }

        .card {
            background-color: var(--color-surface);
            border-radius: 0.75rem;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-md);
        }
        .form-input, .form-select {
            border-radius: 0.5rem;
            border: 1px solid var(--color-border);
            background-color: var(--color-surface);
            color: var(--color-text-primary);
            transition: box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .form-input::placeholder {
            color: var(--color-text-secondary);
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background-color: var(--color-surface);
        }
        .btn-primary {
            background-color: var(--color-primary);
            color: white;
            font-weight: 600;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px 0 rgba(79, 70, 229, 0.3);
        }
        .btn-primary:hover {
            background-color: var(--color-primary-dark);
            box-shadow: 0 2px 8px -2px rgba(79, 70, 229, 0.4);
        }

        .status-delivered { color: var(--color-success); }
        .status-pending { color: var(--color-warning); }
        .status-declined { color: var(--color-danger); }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
    "jspdf": "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm",
    "jspdf-autotable": "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/+esm"
  }
}
</script>
</head>
<body class="h-full font-sans">
    <div id="root" class="min-h-full"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
