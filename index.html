<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calender Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-background-start: #f8fafc; /* Slate-50 */
            --color-background-end: #eef2f5;   /* Slate-100 */
            --color-surface: #ffffff;
            --color-primary: #38bdf8;        /* Sky-400 */
            --color-primary-dark: #0ea5e9;   /* Sky-500 */
            --color-primary-surface: rgba(56, 189, 248, 0.1);
            --color-text-primary: #1e293b;   /* Slate-800 */
            --color-text-secondary: #64748b; /* Slate-500 */
            --color-border: rgba(0, 0, 0, 0.08);
            --color-interactive: #f1f5f9;     /* Slate-100 */
            --color-interactive-hover: #e2e8f0;/* Slate-200 */
            --color-danger: #dc2626;         /* Red-600 */
            --color-success: #16a34a;        /* Green-600 */
            --color-warning: #f59e0b;        /* Amber-500 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
            --shadow-inner: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
        }

        html {
            color-scheme: light;
            font-size: 14px;
        }

        @media (min-width: 640px) { /* sm */
            html {
                font-size: 15px;
            }
        }
        @media (min-width: 1024px) { /* lg */
            html {
                font-size: 16px;
            }
        }

        body {
            background-color: var(--color-background-start);
            background-image: linear-gradient(135deg, var(--color-background-start) 0%, var(--color-background-end) 100%);
            font-family: 'Poppins', sans-serif;
            color: var(--color-text-secondary);
            transition: all 0.3s ease;
            -webkit-text-size-adjust: 100%;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-interactive-hover);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1; /* slate-300 */
        }

        /* Global Component Styles */
        .card {
            background-color: var(--color-surface);
            border-radius: 1.5rem; /* 24px */
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-md);
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out, border-color 0.3s ease-out;
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }
        .form-input, .form-select {
            border-radius: 0.75rem; /* 12px */
            border: 1px solid #cbd5e1; /* slate-300 */
            background-color: var(--color-background-start);
            color: var(--color-text-primary);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .form-input::placeholder {
            color: var(--color-text-secondary);
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background-color: var(--color-surface);
        }
        .btn-primary {
            background-color: var(--color-primary);
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem; /* 12px */
            transition: all 0.2s ease-out;
            box-shadow: 0 4px 20px -5px rgba(56, 189, 248, 0.4);
        }
        .btn-primary:hover {
            background-color: var(--color-primary-dark);
            box-shadow: 0 6px 25px -5px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        .status-delivered { color: var(--color-success); }
        .status-pending { color: var(--color-warning); }
        .status-declined { color: var(--color-danger); }
    </style>
<script type="importmap">
{

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

  }
}
</script>
</head>
<body class="h-full font-sans">
    <div id="root" class="min-h-full"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
